<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>let-items</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let product of letItems">
      <ion-label>{{ product.name }}</ion-label>
      <ion-note slot="end">{{ product.state }}</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
